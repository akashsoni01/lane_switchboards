[package]
name = "lane_messenger_ffi"
version = "0.9.2"
edition = "2021"
description = "Stable FFI for the FunXMPP messenger client (Swift / Android / Flutter / C)"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "lane_messenger_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
default = ["c-api", "tls", "ws"]
c-api = []
tls = ["lane_switchboards/tls"]
ws = ["lane_switchboards/ws"]
uniffi = ["dep:uniffi"]
jni = ["c-api", "dep:jni"]

[dependencies]
lane_switchboards = { path = "..", version = "0.9.2", default-features = false, features = ["messenger"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time", "macros"] }
once_cell = "1.20"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
uniffi = { version = "0.28", optional = true, features = ["cli"] }
jni = { version = "0.21", optional = true, default-features = false }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
lane_switchboards = { path = "..", version = "0.9.2", default-features = false, features = ["messenger", "ws"] }
tokio = { version = "1.38", features = ["full", "test-util"] }
tokio-tungstenite = "0.24"
