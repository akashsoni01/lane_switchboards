// Messenger plane: compact binary client protocol (FunXMPP-style).
//
// Framing (not part of protobuf, see docs/messenger/01_wire_protocol.md):
//   +---------+-------------+------------+------------------+
//   | u8 ver  | u8 pkt_type | u32 length | protobuf payload |
//   +---------+-------------+------------+------------------+
//
// Each pkt_type maps to exactly one message below. Field numbers are
// append-only: never reuse or renumber.
syntax = "proto3";

package lane_switchboard.messenger;

// ---- Control ---------------------------------------------------------------

// pkt_type = 0x01. First frame a client must send.
message Login {
  string user_id = 1;
  string device_id = 2;
  // HMAC-SHA256 token, hex encoded: hex(hmac(secret, "user_id:device_id")).
  string auth_token = 3;
  string client_version = 4;
  // Resume point: highest inbox sequence already seen by this device.
  // Server replays everything after it. 0 = full sync.
  uint64 resume_after_seq = 5;
}

// pkt_type = 0x02
message LoginAck {
  bool ok = 1;
  string error = 2;
  // Server-assigned session id (diagnostics/logging correlation).
  string session_id = 3;
  // Number of offline messages that will be replayed after this ack.
  uint64 pending_messages = 4;
}

// pkt_type = 0x03 / 0x04
message Ping { uint64 seq = 1; }
message Pong { uint64 seq = 1; }

// pkt_type = 0x0F. Fatal, typed error; server closes the connection after.
message ProtocolError {
  ErrorCode code = 1;
  string detail = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  UNSUPPORTED_VERSION = 1;
  NOT_AUTHENTICATED = 2;
  AUTH_FAILED = 3;
  REPLACED_BY_NEW_SESSION = 4;
  FRAME_TOO_LARGE = 5;
  MALFORMED_FRAME = 6;
  RATE_LIMITED = 7;
  UNKNOWN_RECIPIENT = 8;
  MEDIA_TRANSFER_FAILED = 9;
}

// ---- Presence --------------------------------------------------------------

// pkt_type = 0x10. Server -> client notification (and client -> server update).
message Presence {
  string user_id = 1;
  PresenceKind kind = 2;
  // Unix seconds; meaningful for LAST_SEEN.
  uint64 last_seen = 3;
}

enum PresenceKind {
  PRESENCE_KIND_UNSPECIFIED = 0;
  AVAILABLE = 1;
  UNAVAILABLE = 2;
  LAST_SEEN = 3;
}

// ---- Chat ------------------------------------------------------------------

// pkt_type = 0x20. Client -> server -> recipient.
message ChatMessage {
  // Client-generated unique id (UUID); dedup key across retries.
  string message_id = 1;
  string from_user = 2;
  string to_user = 3;
  // Opaque to the server once E2EE lands; today: UTF-8 text or media ref.
  bytes body = 4;
  // Unix millis at sender.
  uint64 sent_at = 5;
  // Set by the recipient's home shard; total order per recipient inbox.
  uint64 seq = 6;
  // If this message references an uploaded media blob (see MediaStart).
  string media_id = 7;
}

// pkt_type = 0x21. Server -> sender: message persisted (single tick).
message ServerAck {
  string message_id = 1;
  uint64 seq = 2;
  // Set on inter-node links: the sending user this ack must be routed to.
  // Empty on direct client connections.
  string to_user = 3;
}

// pkt_type = 0x22. Recipient device -> server -> sender (double tick).
message DeliveredAck {
  string message_id = 1;
  string from_user = 2; // acking user
}

// pkt_type = 0x23. Recipient -> server -> sender (blue tick).
message ReadAck {
  string message_id = 1;
  string from_user = 2;
}

// pkt_type = 0x24. Server -> client after login: offline replay finished.
message SyncComplete {
  uint64 delivered = 1;
  uint64 latest_seq = 2;
  // Set on inter-node links so the receiving gateway can route the marker
  // to the right session. Empty on direct client connections.
  string user_id = 3;
}

// ---- Bulk data / media (e.g. PDF, images) ----------------------------------
//
// Large payloads are never sent as one frame. The sender streams the blob in
// chunks over the same connection; the server stores it and hands out a
// media_id which is then referenced from a normal ChatMessage. The receiver
// pulls the blob with MediaFetch. See docs/messenger/02_bulk_data.md.

// pkt_type = 0x30. Client -> server: begin an upload.
message MediaStart {
  string media_id = 1;   // client-generated UUID
  string file_name = 2;  // e.g. "invoice.pdf"
  string mime_type = 3;  // e.g. "application/pdf"
  uint64 total_size = 4; // bytes; server enforces a max
  string sha256 = 5;     // hex digest of the full blob for integrity check
}

// pkt_type = 0x31. One chunk of the blob (<= 64 KiB recommended).
message MediaChunk {
  string media_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool last = 4;
}

// pkt_type = 0x32. Server -> uploader: upload verified & stored, or per-chunk
// flow-control credit (ok=true, complete=false).
message MediaAck {
  string media_id = 1;
  bool ok = 2;
  bool complete = 3;
  uint64 received_bytes = 4;
  string error = 5;
}

// pkt_type = 0x33. Receiver -> server: request a stored blob; server responds
// with MediaStart metadata followed by MediaChunk frames.
message MediaFetch {
  string media_id = 1;
  uint64 from_offset = 2; // resume support
}

// ---- Groups ----------------------------------------------------------------

// pkt_type = 0x40. Fan-out handled by the group's home shard.
message GroupMessage {
  string message_id = 1;
  string from_user = 2;
  string group_id = 3;
  bytes body = 4;
  uint64 sent_at = 5;
  string media_id = 6;
  // Set per-recipient by the server; total order within each member's inbox.
  uint64 seq = 7;
  // Recipient for this copy; set by the group home shard during fan-out
  // (inter-node links only, empty on the sender's original packet).
  string to_user = 8;
}

// pkt_type = 0x41
message GroupEvent {
  string group_id = 1;
  GroupOp op = 2;
  string actor_user = 3;   // who performed the operation
  string subject_user = 4; // who it applies to (add/remove)
  uint64 version = 5;      // monotonic membership version
  // Notification recipient; set by the group home shard on inter-node links.
  string to_user = 6;
}

enum GroupOp {
  GROUP_OP_UNSPECIFIED = 0;
  CREATE = 1;
  ADD_MEMBER = 2;
  REMOVE_MEMBER = 3;
  LEAVE = 4;
}

// ---- Inter-node (peer) links -------------------------------------------------
//
// Gateways in a cluster connect to each other with the same binary protocol.
// A peer link is authenticated by a PeerHello as its first frame; after that,
// regular packets flow with cluster routing semantics (see
// docs/messenger/05_cluster.md).

// pkt_type = 0x50. First frame on an outbound peer link.
message PeerHello {
  string node_id = 1;
  // hex(HMAC-SHA256(secret, "node_id:peer")) — same Authenticator as clients.
  string auth_token = 2;
}

// pkt_type = 0x51. Broadcast on user login/logout so every node can route
// live deliveries to the right gateway.
message PeerPresence {
  string user_id = 1;
  bool online = 2;
  string node_id = 3;   // gateway holding the session (when online)
  uint64 last_seen = 4; // unix secs (when offline)
}

// pkt_type = 0x52. Login gateway -> user's home shard: replay the inbox.
message PeerSync {
  string user_id = 1;
  uint64 after_seq = 2;
}

// pkt_type = 0x53. Gossip: a new gateway joined the cluster.
message PeerJoin {
  string node_id = 1;
  string addr = 2; // host:port for outbound peer links
}

// pkt_type = 0x54. Gossip: a gateway is leaving (graceful) or failed.
message PeerLeave {
  string node_id = 1;
}

// pkt_type = 0x55. Migrate a user inbox to a new home shard after ring
// rebalance. Sent by the old home; merged idempotently by seen keys.
message PeerHandoffUser {
  string user_id = 1;
  uint64 next_seq = 2;
  repeated string seen = 3;
  repeated ChatMessage chats = 4;
  repeated GroupMessage groups = 5;
}

// pkt_type = 0x56. Migrate group membership to a new home shard.
message PeerHandoffGroup {
  string group_id = 1;
  repeated string members = 2;
  repeated string admins = 3;
  uint64 version = 4;
}

// pkt_type = 0x57. Gossip: a completed media blob is stored on `node_id`.
message PeerMediaReady {
  string media_id = 1;
  string node_id = 2;
}

// ---- End-to-end encryption key directory --------------------------------------
//
// The server only stores and hands out public key material; message bodies
// are encrypted client-side (vodozemac Olm: X3DH-style session setup +
// double ratchet) and are opaque bytes to every node. See
// docs/messenger/10_e2ee.md.

// pkt_type = 0x60. Client -> server after login: publish this device's
// public identity key and a batch of single-use one-time keys.
message PublishKeys {
  string user_id = 1;   // overwritten with the authenticated user
  string device_id = 2;
  string identity_key = 3;           // Curve25519, base64
  repeated string one_time_keys = 4; // Curve25519, base64, single-use
}

// pkt_type = 0x61. Client -> server: request a prekey bundle for a peer.
message FetchKeys {
  string user_id = 1;  // whose keys
  string for_user = 2; // requester; set by the server for reply routing
  string device_id = 3; // empty = most recently published device
}

// pkt_type = 0x62. Server -> client: one single-use prekey bundle. The
// one_time_key is removed from the directory when handed out.
message KeyBundle {
  string user_id = 1;
  string device_id = 2;
  string identity_key = 3;
  string one_time_key = 4;
  string for_user = 5; // reply routing on inter-node links
  bool found = 6;
  repeated string device_ids = 7; // all published devices (informational)
}

// pkt_type = 0x63. Client -> server: revoke a device's published keys.
message RemoveDeviceKeys {
  string user_id = 1;
  string device_id = 2;
}

// Encoded into ChatMessage.body / GroupMessage.body by E2EE clients.
// Not a frame type: the server never parses it.
message EncryptedPayload {
  string sender_key = 1;  // sender's Curve25519 identity key, base64
  uint32 message_type = 2; // 0 = Olm pre-key message, 1 = normal message
  bytes ciphertext = 3;
}

// Encoded into GroupMessage.body by E2EE clients (Megolm sender-keys).
// Not a frame type: the server never parses it.
message EncryptedGroupPayload {
  string session_id = 1; // Megolm session id (Ed25519 pubkey, base64)
  bytes ciphertext = 2; // MegolmMessage bytes
}

// Olm-encrypted 1:1 side-channel for distributing a Megolm session key.
// Plaintext inside an EncryptedPayload after pairwise decrypt.
message GroupSessionKeyShare {
  string group_id = 1;
  string session_id = 2;
  string session_key = 3; // SessionKey portable format, base64
}
