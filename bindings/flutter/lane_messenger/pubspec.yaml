name: lane_messenger
description: FunXMPP messenger FFI plugin (wraps liblane_messenger_ffi)
version: 0.9.2
environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.lane.messenger
        pluginClass: LaneMessengerPlugin
      ios:
        pluginClass: LaneMessengerPlugin
