groups:
  # Shorter `for` windows for examples/observability_demo — use alongside alerts.yml.
  - name: lane_actor_alerts_demo
    rules:
      - alert: LaneActorInFlightStuck
        expr: sum(lane_actor_in_flight) > 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: Actor handle may be deadlocked (demo)
          description: Triggered by observability_demo phase 8 — in-flight hold.

      - alert: LaneActorHandleTimeouts
        expr: sum(rate(lane_actor_handle_timeouts_total[2m])) > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Actor handle timeouts (demo)

      - alert: LaneSupervisorRestartStorm
        expr: sum(rate(lane_supervisor_restarts_total[5m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Supervisor restarts elevated (demo)

      - alert: LaneMailboxBackpressure
        expr: |
          sum(lane_actor_mailbox_depth)
          /
          clamp_min(sum(lane_actor_mailbox_capacity), 1)
          > 0.75
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Actor mailbox over 75% full (demo)

      - alert: LaneCounterSaturated
        expr: sum(rate(lane_actor_counter_saturated_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Actor stat counter hit usize::MAX
