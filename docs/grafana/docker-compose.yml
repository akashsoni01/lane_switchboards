# Prometheus + Grafana for local Lane metrics development.
#
# Terminal 1 — exporter (pick one; both use host port 9090):
#   cargo run --example metrics_exporter --features metrics
#   cargo run --example resilient_monitor --features metrics
# Terminal 2 — observability stack:
#   docker compose -f docs/grafana/docker-compose.yml up
# Grafana:  http://localhost:3000  (admin / admin)
# Prometheus UI: http://localhost:9091
# Dashboard: Lane → Lane Actor Runtime (auto-provisioned)

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./actor-runtime.json:/var/lib/grafana/dashboards/actor-runtime.json:ro
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
