[package]
name = "lane_switchboards-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
lane_switchboards = { path = "..", features = ["messenger"] }

[[bin]]
name = "messenger_codec"
path = "fuzz_targets/messenger_codec.rs"
test = false
doc = false
bench = false
