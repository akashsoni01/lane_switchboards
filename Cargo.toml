[workspace]
members = [".", "lane_core"]
resolver = "2"

[package]
name = "lane_switchboards"
version = "0.9.2"
edition = "2021"
description = "Telecom-inspired OTP actor runtime for Rust: mailbox routing, supervision trees, let-it-crash fault isolation, and distributed messaging"
license = "MIT"
readme = "README.md"
keywords = ["actor", "otp", "supervision", "concurrency", "erlang"]
categories = ["asynchronous", "concurrency"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "build.rs",
    "proto/**",
    "src/**",
    "docs/**",
]

[dependencies]
lane_core = { path = "lane_core", version = "0.9.2" }
prost = "0.13"
tonic = { version = "0.12", features = ["transport", "codegen"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
tokio = { version = "1.38", features = ["full"] }
tracing = { version = "0.1", features = ["log", "max_level_info", "release_max_level_warn"] }
# serde: ServiceRecord and ConsistencyConfig (HTTP/debug fixtures — not on gRPC wire)
serde = { version = "1.0", features = ["derive", "rc"] }
async-trait = "0.1"
thiserror = "2"
# messenger auth tokens (HMAC-SHA256) and media integrity checksums
hmac = "0.12"
sha2 = "0.10"
arc-swap = "1.7"
# messenger client sockets: TCP keepalive below the app-level Ping/Pong
socket2 = "0.5"
once_cell = "1.20"
futures = "0.3"
futures-util = "0.3"
murmur3 = "0.5"
rustls = { version = "0.23", optional = true, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []
monitor = ["lane_core/monitor"]
metrics = ["lane_core/metrics", "monitor"]
watch_sync = []
tls = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:webpki-roots",
    "tonic/tls",
    "tonic/tls-webpki-roots",
]

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1.38", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "ecommerce"
harness = false

[[bench]]
name = "messenger_codec"
harness = false

[[example]]
name = "ecommerce_flash_sale"
path = "examples/ecommerce_flash_sale.rs"

[[example]]
name = "calculator_mesh"
path = "examples/calculator_mesh.rs"

[[example]]
name = "calculator_mesh_simplified"
path = "examples/calculator_mesh_simplified.rs"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

