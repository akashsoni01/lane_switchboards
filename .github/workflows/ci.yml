name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Without default features (no messenger)
        run: cargo test -p lane_switchboards --lib --no-default-features
      - name: Default features (messenger)
        run: cargo test --workspace
      - name: TLS messenger tests
        run: cargo test --features tls --test messenger
      - name: Metrics feature
        run: |
          cargo test --workspace --features metrics
          cargo test --features metrics --test metrics_export
          cargo check --examples --features metrics -p lane_switchboards

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  fuzz-smoke:
    runs-on: ubuntu-latest
    # Nightly + cargo-fuzz; smoke only (short budget). Full corpus runs offline.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz target
        run: cargo +nightly fuzz build messenger_codec
        working-directory: .
        continue-on-error: true
      - name: Smoke fuzz (30s)
        run: cargo +nightly fuzz run messenger_codec -- -max_total_time=30
        continue-on-error: true

  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm -v "${{ github.workspace }}/docs/grafana:/etc/prometheus" \
            prom/prometheus:v2.54.1 \
            promtool check rules /etc/prometheus/alerts.yml
